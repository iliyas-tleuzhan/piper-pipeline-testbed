schema_version: piper_x_handeye_rejection.v1
status: rejected
reason: >
  Saved hand-eye calibration produced large fixed-marker drift across manually
  selected stopped PiPER-X poses. The root cause is currently attributed to
  unverified PiPER-X FK/URDF/frame semantics, with a secondary rectified-camera
  geometry issue fixed in software after the rejected calibration was captured.
