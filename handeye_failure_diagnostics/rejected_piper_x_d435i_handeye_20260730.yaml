parameters:
  namespace: /piper_x_d435i_wrist_eye_on_hand/
  eye_on_hand: true
  robot_base_frame: base_link
  robot_effector_frame: gripper_base
  tracking_base_frame: wrist_camera_color_optical_frame
  tracking_marker_frame: aruco_marker_frame
transformation:
  parent_frame: gripper_base
  child_frame: wrist_camera_color_optical_frame
  x: -0.04691137127557213
  y: -0.05499380727707069
  z: -0.1515220436421454
  qx: -0.10526036717822013
  qy: 0.004044373325145512
  qz: 0.09080385673881869
  qw: 0.9902820596917167
computed_from:
  sample_count: 23
  algorithm: OpenCV/Tsai-Lenz
  opencv_version: 4.2.0
  source_sample_file: /tmp/piper_x_d435i_sample_list.yaml
validation:
