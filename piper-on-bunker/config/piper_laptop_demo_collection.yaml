mode: piper_demo_collection
physical_motion_enabled: true
arm_adapter: piper_ros
camera_adapter: external_realsense
base_adapter: mock
action_server_url: http://localhost:8891
expected_joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
named_poses: {}
safety:
  require_local_activation: true
  require_base_locked_for_manipulation: true
  require_live_robot_state: true
  require_non_estop: true
  max_state_age_s: 1.0
  max_camera_age_s: 1.0
  command_timeout_s: 20.0
  joint_tolerance_rad: 0.03
  gripper_tolerance_m: 0.005
  pose_reached_timeout_s: 5.0
  max_speed_scaling: 0.05
  max_acceleration_scaling: 0.05
  demo_joint_step_rad: 0.02
  demo_gripper_step_m: 0.002
  gripper_min_m: 0.0
  gripper_max_m: 0.06
  workspace_bounds_m:
    x: [0.15, 0.55]
    y: [-0.30, 0.30]
    z: [0.02, 0.35]
transforms: {}
logging:
  enabled: true
  directory: piper-on-bunker/logs
  format: jsonl
