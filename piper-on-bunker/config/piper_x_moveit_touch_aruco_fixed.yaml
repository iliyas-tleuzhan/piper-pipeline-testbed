marker:
  dictionary: DICT_ARUCO_ORIGINAL
  id: 6
  size_m: 0.100

camera:
  image_topic: /wrist_camera/color/image_rect_color
  marker_pose_topic: /aruco_simple/pose

moveit:
  planning_group: arm
  end_effector_link: gripper_base
  planning_frame: world
  move_group_required: true

taught_poses:
  home: home
  pre_touch: pre_touch
  touch: touch
  retract: retract
  safe_recovery: safe_recovery
  manifest: piper-on-bunker/data/local/moveit_aruco_touch/taught_poses.yaml

motion:
  motion_strategy: taught_joint_sequence
  hold_duration_s: 1.0
  velocity_scaling: 0.05
  acceleration_scaling: 0.05
  planning_timeout_s: 10.0
  execution_timeout_s: 20.0
  max_joint_jump_rad: 0.20
  max_adjacent_joint_delta_rad: 0.10
  max_segment_duration_s: 30.0
  max_mission_duration_s: 90.0
  min_effective_joint_velocity_rad_s: 0.001
  max_target_error_rad: 0.02
  continuity_tolerance_rad: 0.001
  future_cartesian_mode:
    enabled: false
    touch_direction_ee: [0.0, 0.0, 1.0]
    press_distance_m: 0.020
    retract_distance_m: 0.020
    cartesian_fraction_threshold: 1.0

safety:
  max_marker_pose_age_s: 0.5
  max_image_age_s: 0.5
  max_joint_state_age_s: 0.5
  marker_stability_required_s: 0.5
  # Teaching-only tolerance for small encoder/model zero disagreements while
  # PiPER-X FK remains unverified. This does not authorize physical execution.
  taught_pose_limit_tolerance_rad: 0.02
  physical_execution_enabled_by_default: false
  joint_limits:
    joint1: [-2.618, 2.618]
    joint2: [-2.618, 2.618]
    joint3: [-2.967, 0.0]
    joint4: [-1.745, 1.745]
    joint5: [-1.22, 1.22]
    joint6: [-2.094, 2.094]
  workspace_limits:
    x_m: [-0.10, 0.70]
    y_m: [-0.40, 0.40]
    z_m: [0.02, 0.80]

robot_model:
  model: agilex_piper_x_unverified
