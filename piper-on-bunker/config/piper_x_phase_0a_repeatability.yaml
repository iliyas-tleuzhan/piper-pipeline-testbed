schema_version: piper_x.phase_0a_repeatability_config.v2

identity:
  arm_id: unknown
  arm_serial: unknown
  firmware: unknown
  can_interface: can0
  physical_mounting_id: unknown
  side: unknown
  camera_serial: unknown
  camera_mount_id: unknown
  tool_id: unknown
  tool_description: unknown

runtime:
  joint_state_topic: /piper_x/joint_states
  expected_feedback_source_id: piper_x_passive_socketcan_feedback_v1
  expected_joint_mapping_version: piper_x_lora_feedback_2a5_2a6_2a7_raw001deg_to_rad_v1
  expected_dependency_commit: 521c9c5fdfd9ee63bd96c0f9342fca6b2398092e
  can_interface: can0
  max_joint_state_age_s: 0.5
  max_abs_velocity_rad_s: 0.01

robot_model:
  urdf_path: unknown
  urdf_sha256: unknown
  planning_group: arm
  planning_frame: world
  end_effector_link: gripper_base

execution:
  backend: pyagxarm_piper_x_follow_joint_trajectory
  command_primitive: AgxArm.move_js
  command_rate_hz: 50.0
  speed_percent: 30
  endpoint_tolerance_rad: 0.03
  settle_timeout_s: 3.0
  physical_execution_enabled_by_default: false
  stop_command:
    - tools/stop_piper_x_moveit_motion.sh

repeatability:
  diagnostic_id_prefix: piper_x_phase_0a
  output_root: piper-on-bunker/data/local/calibration/phase_0a
  taught_pose_manifest: piper-on-bunker/data/local/moveit_aruco_touch/taught_poses.yaml
  moveit_touch_config: piper-on-bunker/config/piper_x_moveit_touch_aruco_fixed.yaml
  measurement_pose_name: staging
  allowed_departure_pose_names:
    - repeatability_departure
  default_departure_pose_name: repeatability_departure
  observation_sample_rate_hz: 20.0
  observation_duration_s: 10.0
  require_base_stopped_ack: true
  checklist_path: ""
  lock_path: /tmp/piper_x_phase_0a_repeatability.lock
  rejected_handeye_path: handeye_failure_diagnostics/rejected_piper_x_d435i_handeye_20260730.yaml
  thresholds:
    minimum_completed_cycles: 3
    maximum_joint_endpoint_error_rad: 0.02
    maximum_joint_repeatability_std_rad: 0.005
    maximum_joint_repeatability_range_rad: 0.01
    maximum_settle_time_s: 5.0
    maximum_stale_feedback_events: 0
    physical_repeatability_target_mm: 10.0
    maximum_pairwise_physical_spread_mm: 20.0
    maximum_measurement_uncertainty_mm: 5.0
