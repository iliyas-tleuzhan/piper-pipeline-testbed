handeye:
  source: UNVERIFIED_LOCAL_VALUE_REQUIRED
  verified: false
  # Transform gripper_base -> wrist_camera_color_optical_frame.
  # Replace in an ignored local copy only after validation. Do not paste the
  # rejected 2026-07-30 calibration here as verified.
  translation_xyz_m: [0.0, 0.0, 0.0]
  quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

gripper:
  tip_offset_source: UNMEASURED_LOCAL_VALUE_REQUIRED
  # Contact tip location expressed in gripper_base coordinates.
  tip_offset_from_gripper_base_xyz_m: [0.0, 0.0, 0.0]

depth:
  roi_px: 7
  min_depth_m: 0.030
  max_depth_m: 0.800

alignment:
  image_center_tolerance_px: 24.0
  max_lateral_step_m: 0.010
  max_forward_step_m: 0.020
  simple_up_step_m: 0.020
  simple_forward_step_m: 0.020
  simple_forward_axis_world: [1.0, 0.0, 0.0]
  continuous_forward_stop_depth_m: 0.010
