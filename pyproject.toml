[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-pipeline-testbed"
version = "0.1.0"
description = "Offline-first PiPER-on-Bunker manipulation pipeline testbed"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.103,<0.125",
    "pydantic>=2,<3",
    "PyYAML>=5.3,<7",
    "requests>=2.31,<3",
    "uvicorn>=0.23,<0.31",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9", "httpx>=0.24,<0.29"]

[project.scripts]
piper-pipeline = "piper_on_bunker.cli:main"
piper-agent-api = "piper_on_bunker.agent.api:main"

[tool.setuptools]
package-dir = {"" = "piper-on-bunker/src"}

[tool.setuptools.packages.find]
where = ["piper-on-bunker/src"]
